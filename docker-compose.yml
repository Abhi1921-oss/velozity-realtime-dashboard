version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: velozity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: velozity_user
      POSTGRES_PASSWORD: velozity_secure_password
      POSTGRES_DB: velozity_dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velozity_user -d velozity_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: velozity-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://velozity_user:velozity_secure_password@postgres:5432/velozity_dashboard?schema=public
      JWT_ACCESS_SECRET: velozity_super_secret_access_jwt_key_2026_x89
      JWT_REFRESH_SECRET: velozity_super_secret_refresh_jwt_key_2026_z12
      CLIENT_URL: http://localhost:3000
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: velozity-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  postgres_data:
