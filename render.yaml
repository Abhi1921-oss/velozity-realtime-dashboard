databases:
  - name: velozity-db
    databaseName: velozity_dashboard
    user: velozity_user
    plan: free

services:
  # Backend API & WebSocket Service
  - type: web
    name: velozity-api
    env: node
    rootDir: server
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm run seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: velozity-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: "*"

  # Frontend Vite React Static Site
  - type: web
    name: velozity-client
    env: static
    rootDir: client
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: velozity-api
          property: url
      - key: VITE_WS_URL
        fromService:
          type: web
          name: velozity-api
          property: url
