databases:
  - name: velozity-db
    databaseName: velozity_dashboard
    user: velozity_user
    plan: free

services:
  - type: web
    name: velozity-dashboard
    env: node
    plan: free
    buildCommand: npm install --include=dev && cd server && npm install --include=dev && npx prisma generate && npm run build && cd ../client && npm install --include=dev && npm run build
    startCommand: cd server && npx prisma db push --accept-data-loss && npm run seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: velozity-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: "*"
